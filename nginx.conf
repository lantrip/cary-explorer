server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location ^~ /assets/ {
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /data/ {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|json|geojson|map|png|jpg|jpeg|gif|ico|svg|woff2?|html)$ {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
