name: Repair initial package visibility
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  remove-undeployed-public-bootstrap:
    if: github.repository == 'lantrip/cary-explorer'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the known initial public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint=users/lantrip/packages/container/cary-explorer
          gh api "$endpoint" > package.json
          jq -e '.visibility == "public" and .repository.full_name == "lantrip/cary-explorer"' package.json
          gh api "$endpoint/versions" > versions.json
          jq -e 'length == 1 and .[0].name == "sha256:dd8d69d760653ba52541ca6a26dca67060f6f3a9816ecd28f4221584929a4bbe" and .[0].metadata.container.tags == ["v0.1.0"]' versions.json
          gh api --method DELETE "$endpoint"
